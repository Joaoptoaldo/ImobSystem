{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Página base do projeto Django (modelo para futuras aplicações).">
	<title>{% block title %}Projeto{% endblock %}</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

	<style>
		/* ajuste para que o conteúdo preencha toda a altura da página */
		html, body { height: 100%; }
		body { display: flex; flex-direction: column; }
		main { flex: 1 0 auto; }
	</style>
</head>
<body>
	<header class="py-3 border-bottom bg-white">
		<div class="container d-flex align-items-center justify-content-between">
			<a class="navbar-brand m-0 fw-semibold" href="#">Modelo Django</a>
		</div>
	</header>

	<main class="container py-4">
		{% if messages %}
			{% for message in messages %}
				<div class="alert {{ message.tags }} alert-dismissible fade show" role="alert">
					{{ message }}
					<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
				</div>
			{% endfor %}
		{% endif %}

		{% block content %}
		{% endblock %}
	</main>

	<footer class="border-top py-4">
		<div class="container d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-2">
			<div class="fw-semibold">Modelo Django</div>
			<div class="text-secondary">© {% now "Y" %} João Pedro Toaldo</div>
		</div>
	</footer>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
</body>
</html>
