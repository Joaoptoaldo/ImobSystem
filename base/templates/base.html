{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>ImobSystem — {% block title %}{% endblock %}</title>

	<link rel="icon" type="image/svg+xml" href="{% static 'images/icon.svg' %}">

	<!-- Bootstrap 5 CSS -->
	<!-- Bootstrap 5 vanilla
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
	-->

	<!-- Bootswatch theme (Bootstrap 5) -->
	<link href="https://bootswatch.com/5/brite/bootstrap.min.css" rel="stylesheet">

	<!-- icones -->
	<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css" integrity="sha384-DyZ88mC6Up2uqS4h/KRgHuoeGwBcD4Ng9SiP4dIRy0EXTlnuz47vAwmeGwVChigm" crossorigin="anonymous"/>

	<link rel="stylesheet" href="{% static 'css/styles.css' %}">

</head>
<body>  

	{% include 'navbar.html' %}
	
	<!-- Toast container para notificações -->
	<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1080;">
		{% include 'message.html' %}
	</div>
	
	{% block content %}
	{% endblock %} 
 
	<!-- JS-->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>

	<!-- custom JS -->
	<script src="{% static 'js/location-calc.js' %}"></script>
	<script src="{% static 'js/form-validations.js' %}"></script>
	<script src="{% static 'js/image-preview.js' %}"></script>
	<script src="{% static 'js/toast-messages.js' %}"></script>

</body>
</html>
