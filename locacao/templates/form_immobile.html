{% extends 'base.html' %}

{% block title %}Cadastrar Imóvel{% endblock %}

{% load static %}

{% block content %}
<div class="container">
    <div class="d-flex gap-4 mt-3"> 
        
        <form class="col-md-6" action="{% url 'immobile-create' %}" method="post" 
            enctype="multipart/form-data" novalidate>
            {% csrf_token %} 
            <h3>Cadastrar Imóvel</h3>
            {% for field in form %}
            <div class="mt-3">
                {{field.label}}
                {{field}}
            </div>
            {% endfor %}
            <div class="mt-3">
                <label>Imagens do Imóvel</label>
                <input type="file" name="immobile" class="form-control" multiple>
            </div>
            <input type="submit" class="btn btn-primary mt-3" value="Salvar">
        </form>

    </div>
</div>
{% endblock %}
